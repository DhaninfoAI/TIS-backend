<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartFill API Explorer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2457d6;
          --red:#c62828; --amber:#b26a00; --green:#1b7f3b; --blue:#2457d6; --chip:#eef2ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b1f27; --ink:#e6e9ef; --muted:#98a2b3; --line:#2b313c; --accent:#7aa2ff; --chip:#232a3b; } }
  * { box-sizing: border-box }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink) }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--card) }
  header h1 { font-size:16px; margin:0 12px 0 0 }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--chip) }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px 20px; max-width:1400px; margin:auto }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding:16px } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px }
  button, select, input { font:inherit; color:inherit }
  button { background:var(--accent); color:#fff; border:0; border-radius:7px; padding:7px 12px; cursor:pointer; margin:3px 4px 3px 0 }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line) }
  select, input { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:6px 8px; width:100% }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; max-height:360px; font-size:12px; white-space:pre-wrap; word-break:break-word }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px }
  .tab { padding:5px 10px; border-radius:99px; border:1px solid var(--line); cursor:pointer; font-size:13px; background:var(--card) }
  .tab.on { background:var(--accent); color:#fff; border-color:var(--accent) }
  .tab .n { font-size:11px; opacity:.8; margin-left:4px }
  .item { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0 }
  .item.blocker { border-left-color:var(--red) } .item.warning { border-left-color:var(--amber) } .item.advisory { border-left-color:var(--blue) } .item.info, .item.pass { border-left-color:var(--green) }
  .item .t { font-weight:600 } .item .m { color:var(--muted); font-size:13px } .item .w { font-size:12px; margin-top:4px }
  .sev { font-size:11px; text-transform:uppercase; font-weight:700; margin-right:6px }
  .sev.blocker { color:var(--red) } .sev.warning { color:var(--amber) } .sev.advisory { color:var(--blue) } .sev.info { color:var(--green) }
  .kpis { display:flex; gap:10px; flex-wrap:wrap } .kpi { flex:1; min-width:110px; border:1px solid var(--line); border-radius:8px; padding:8px 10px }
  .kpi b { font-size:20px; display:block }
  table { width:100%; border-collapse:collapse; font-size:13px } td, th { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left } th { color:var(--muted); font-weight:600 }
  .log { font-family:ui-monospace, Consolas, monospace; font-size:12px; max-height:180px; overflow:auto }
</style>
</head>
<body>
<header>
  <h1>SmartFill · dev backend</h1>
  <span class="pill" id="health">checking…</span>
  <span class="pill">spec: docs/BACKEND_REQUIREMENTS.md v0.2</span>
</header>
<main>
  <section>
    <div class="card">
      <h2>1 · Snapshot</h2>
      <label>Token (Authorization: Bearer …)</label><input id="token" value="dev-token">
      <label>Fixture</label><select id="fixture"></select>
      <button onclick="upload()">PUT snapshot</button>
      <button class="ghost" onclick="show(api('GET', `/v1/orders/${oid()}/rules-pack`))">Rules pack</button>
    </div>
    <div class="card">
      <h2>2 · Analyse</h2>
      <button onclick="analyze()">POST analyses + live events</button>
      <button class="ghost" onclick="analyze(true)">force</button>
      <button class="ghost" onclick="rerun()">Rerun narrative</button>
      <button class="ghost" onclick="finalCheck()">Final check</button>
      <div class="log" id="log"></div>
    </div>
    <div class="card">
      <h2>3 · Cost (OpenAI list prices)</h2>
      <button onclick="cost()">Compare models for this order</button>
      <label>Photos (override)</label><input id="photos" placeholder="e.g. 66">
    </div>
    <div class="card">
      <h2>4 · Learning & rules</h2>
      <button class="ghost" onclick="feedback()">POST sample feedback</button>
      <button class="ghost" onclick="outcome()">POST qc-outcome</button>
      <button class="ghost" onclick="show(api('GET','/v1/analytics/summary'))">Analytics</button>
      <button class="ghost" onclick="show(api('GET','/v1/analytics/inspectors/mkan'))">Inspector card</button>
      <button class="ghost" onclick="show(api('GET','/v1/rules/tree'))">Rules tree</button>
      <button class="ghost" onclick="draftRule()">Draft + test a rule</button>
      <button class="ghost" onclick="show(api('GET','/v1/rules/changelog'))">Changelog</button>
      <button class="ghost" onclick="show(api('GET','/v1/form-registry'))">Form registry</button>
      <button class="ghost" onclick="show(api('GET','/v1/config'))">Config</button>
    </div>
  </section>
  <section>
    <div class="card">
      <h2>Result</h2>
      <div class="kpis" id="kpis"></div>
      <div class="tabs" id="tabs" style="margin-top:12px"></div>
      <div id="items"></div>
    </div>
    <div class="card"><h2>Raw response</h2><pre id="raw">—</pre></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let snap = null, analysis = null, current = 'checks';
const oid = () => snap?.order?.orderId;
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Authorization': 'Bearer ' + $('token').value, 'Content-Type': 'application/json', 'X-EZ-User': 'explorer' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json(); j.__status = r.status; return j;
}
async function show(p) { const j = await p; $('raw').textContent = JSON.stringify(j, null, 2); return j; }
const log = m => { $('log').innerHTML += m + '<br>'; $('log').scrollTop = 1e9; };
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

(async () => {
  const h = await fetch('/v1/health').then(r => r.json());
  $('health').textContent = `${h.engine} · rules v${h.rulesVersion} · KB clients ${h.kbLoaded}`;
  const list = await fetch('/fixtures/').then(r => r.json());
  $('fixture').innerHTML = list.map(f => `<option>${f}</option>`).join('');
})();

async function upload() {
  snap = await fetch('/fixtures/' + $('fixture').value).then(r => r.json());
  const j = await show(api('PUT', `/v1/orders/${oid()}/snapshot`, snap));
  log(`snapshot ${j.snapshotId} · ${j.stats?.fields} fields · ${j.photosNeeded?.length} photos needed`);
}
async function analyze(force) {
  if (!snap) await upload();
  const j = await show(api('POST', `/v1/orders/${oid()}/analyses${force ? '?force=true' : ''}`, {}));
  if (j.cached) { log('cached analysis ' + j.analysisId); return load(j.analysisId); }
  log('analysis ' + j.analysisId + ' queued');
  const es = new EventSource(j.events);
  es.addEventListener('module.started', e => log('▶ ' + JSON.parse(e.data).module));
  es.addEventListener('module.completed', e => { const d = JSON.parse(e.data); log(`✓ ${d.module} (${(d.result.items || []).length} items, ${d.result.engine})`); load(j.analysisId); });
  es.addEventListener('analysis.completed', e => { log('■ done ' + JSON.stringify(JSON.parse(e.data).summary)); es.close(); load(j.analysisId); });
  es.onerror = () => es.close();
}
async function load(id) { analysis = await api('GET', '/v1/analyses/' + id); render(); $('raw').textContent = JSON.stringify(analysis, null, 2).slice(0, 20000); }
async function rerun() { if (!analysis) return; await api('PUT', `/v1/orders/${oid()}/snapshot`, snap); const j = await show(api('POST', `/v1/orders/${oid()}/analyses/${analysis.analysisId}/rerun`, { modules: ['narrative'] })); log('rerun ' + j.rerunning); setTimeout(() => load(analysis.analysisId), 1500); }
async function finalCheck() {
  const j = await show(api('POST', `/v1/orders/${oid()}/final-check`, {}));
  analysis = analysis || { modules: {} };
  analysis.modules.finalCheck = { status: 'done', summary: { ready: j.ready }, items: [...(j.blockers || []), ...(j.warnings || [])] };
  current = 'finalCheck'; render();
}
function render() {
  const s = analysis.summary || {};
  $('kpis').innerHTML = [['Blockers', s.blockers], ['Warnings', s.warnings], ['Advisories', s.advisories], ['Missed hazards', s.hazardsMissed], ['LLM cost', analysis.usage ? '$' + analysis.usage.cost : '—']]
    .map(([k, v]) => `<div class="kpi"><b>${v ?? '—'}</b>${k}</div>`).join('');
  const mods = analysis.modules || {};
  $('tabs').innerHTML = Object.keys(mods).map(m => { const n = (mods[m].items || []).filter(i => i.status !== 'pass').length;
    return `<span class="tab ${m === current ? 'on' : ''}" onclick="current='${m}';render()">${m}<span class="n">${mods[m].status === 'done' ? n : '…'}</span></span>`; }).join('');
  const m = mods[current]; if (!m) { $('items').innerHTML = ''; return; }
  const sum = m.summary ? `<pre>${esc(JSON.stringify(m.summary, null, 1))}</pre>` : '';
  $('items').innerHTML = sum + (m.items || []).map(i => `<div class="item ${i.status === 'pass' ? 'pass' : i.severity}">
      <div class="t"><span class="sev ${i.status === 'pass' ? 'info' : i.severity}">${i.status === 'pass' ? 'ok' : i.severity}</span>${esc(i.title)}</div>
      <div class="m">${esc(i.message)}</div>
      ${(i.proposedWrites || []).length ? `<div class="w">✎ ${i.proposedWrites.map(w => `<code>${esc(w.key)}</code> ← ${esc(String(w.value).slice(0, 140))}`).join('<br>✎ ')}</div>` : ''}
      <div class="w" style="color:var(--muted)">conf ${i.confidence ?? '–'} ${i.checklistItem ? '· checklist ' + i.checklistItem : ''} ${i.evidence?.photos?.length ? '· photos ' + i.evidence.photos.join(', ') : ''} ${i.reasoning ? '· ' + esc(i.reasoning) : ''}</div>
    </div>`).join('');
}
async function cost() {
  if (!snap) await upload();
  const n = $('photos').value;
  const j = await show(api('GET', `/v1/orders/${oid()}/cost-compare${n ? '?photos=' + n : ''}`));
  if (!j.rows) return;
  if (n) { for (const r of j.rows) { const e = await api('GET', `/v1/orders/${oid()}/cost-estimate?photoModel=${r.photoModel}&reasonModel=${r.reasonModel}&photos=${n}`); r.perOrder = e.total; r.photoPart = +e.photo.cost.toFixed(4); r.reasonPart = +e.reason.cost.toFixed(4);
    r.perOrderBatch = (await api('GET', `/v1/orders/${oid()}/cost-estimate?photoModel=${r.photoModel}&reasonModel=${r.reasonModel}&photos=${n}&batch=true`)).total; } }
  $('items').innerHTML = `<table><tr><th>Photo model</th><th>Reasoning model</th><th>Photos $</th><th>Reasoning $</th><th>Per order</th><th>Batch API</th><th>× 1,000 orders</th></tr>` +
    j.rows.map(r => `<tr><td>${r.photoModel}</td><td>${r.reasonModel}</td><td>${r.photoPart}</td><td>${r.reasonPart}</td><td><b>$${r.perOrder.toFixed(3)}</b></td><td>$${r.perOrderBatch.toFixed(3)}</td><td>$${(r.perOrder * 1000).toFixed(0)}</td></tr>`).join('') + '</table>';
  $('tabs').innerHTML = ''; $('kpis').innerHTML = '';
}
async function feedback() {
  const items = Object.values(analysis?.modules || {}).flatMap(m => m.items || []).slice(0, 5).map((i, k) => ({ itemId: i.id, module: i.module, decision: ['accepted', 'rejected', 'edited', 'accepted', 'accepted'][k], reason: k === 1 ? 'client_does_not_care' : undefined }));
  show(api('POST', '/v1/feedback', { analysisId: analysis?.analysisId, orderId: oid(), trigger: 'manual', items }));
}
function outcome() { const q = analysis?.modules?.qcChecklist?.summary || {}; show(api('POST', `/v1/orders/${oid()}/qc-outcome`, { inspector: snap?.order?.inspector, section6: q.section6, rating: q.rating, note: q.section8Draft, minutes: 6 })); }
async function draftRule() {
  const rule = { id: 'client.seneca.ebike', kind: 'dsl', severity: 'warning', checklistItem: '5.4', scope: { formTypes: ['general'] },
    when: { q: 'housekeeping', equals: 'No' }, then: { q: 'housekeeping', in: ['Yes'] }, message: 'Demo rule: housekeeping answered No (shows the draft → test → publish flow).' };
  await api('PUT', '/v1/rules/rule/' + rule.id, { rule });
  show(api('POST', `/v1/rules/rule/${rule.id}/test`, {}));
}
</script>
</body>
</html>
