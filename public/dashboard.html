<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartFill Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same tokens as the extension panel: calm neutrals, navy as the one accent, light + dark.
   Before sign-in and for admins: SmartFill's own mark (the Boost star). A customer sees their own logo. */
:root { --font: Geologica, "Segoe UI", system-ui, sans-serif; --bg: #f4f5f7; --card: #fff; --card-2: #f9fafb; --ink: #1d2433; --ink-2: #344054; --muted: #6b7280;
  --line: #e5e7eb; --line-2: #eef0f3; --chip: #f1f2f4; --brand: #12254a; --brand-ink: #fff; --brand-soft: #eef2f8; --accent: #2f5597; --mark: #2f5597;
  --red: #b42318; --soft-red: #fdf2f1; --amber: #a15c07; --soft-amber: #fdf6e7; --green: #0f7a4c; --soft-green: #eef8f2; --shadow: 0 1px 3px rgba(16,24,40,.06); color-scheme: light; }
:root[data-theme="dark"] { --bg: #111317; --card: #1a1d22; --card-2: #1f2228; --ink: #e7e9ec; --ink-2: #cdd1d7; --muted: #979ea9; --line: #2a2e35; --line-2: #24282e; --chip: #262a31;
  --brand: #d9e2f1; --brand-ink: #12254a; --brand-soft: #222a38; --accent: #9fb8e3; --mark: #8fb0e6; --red: #f3877e; --soft-red: #2a1c1c; --amber: #f2b85b; --soft-amber: #2a2317;
  --green: #5fcf98; --soft-green: #17261f; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; } html, body { margin: 0; }
body { font: 13.5px/1.5 var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; } [hidden] { display: none !important; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.mark { height: 26px; width: auto; display: block; } .logo { height: 24px; max-width: 180px; object-fit: contain; } .logo-dark { display: none; } [data-theme="dark"] .logo-light { display: none; } [data-theme="dark"] .logo-dark { display: block; }
.primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 500; cursor: pointer; }
.primary:disabled { opacity: .5; cursor: default; }
.ghost { background: var(--card); color: var(--ink-2); border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; cursor: pointer; }
.ghost:hover { background: var(--chip); } .sm { padding: 4px 10px; font-size: 12px; }
input, select { background: var(--card-2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
textarea { font: inherit; color: inherit; background: var(--card-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; resize: vertical; line-height: 1.55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.signin form { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
.signin h1 { font-size: 19px; font-weight: 500; margin: 18px 0 4px; } .signin label { display: block; font-size: 12px; color: var(--muted); margin-top: 14px; }
.signin input { width: 100%; margin-top: 4px; } .signin .primary { width: 100%; margin-top: 20px; } .err { color: var(--red); font-size: 12.5px; min-height: 18px; margin: 10px 0 0; }

/* shell */
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 24px; background: color-mix(in srgb, var(--card) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.reset-row { flex-basis: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.org-cell { display: flex; align-items: center; gap: 10px; } .org-logo { height: 22px; max-width: 70px; object-fit: contain; }
.brand-edit { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding-top: 4px; border-top: 1px solid var(--line-2); }
.logo-prev { display: flex; gap: 8px; flex-basis: 100%; } .lp { display: grid; place-items: center; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); }
.lp.light { background: #fff; } .lp.dark { background: #1a1d22; } .lp img { height: 24px; max-width: 160px; object-fit: contain; }
.form label.chk { display: flex; align-items: center; gap: 6px; } .form label.chk input { min-width: 0; margin: 0; }
header .title { font-weight: 500; padding-left: 12px; border-left: 1px solid var(--line); }
header .who { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: var(--chip); color: var(--ink-2); } .badge.admin { background: var(--brand); color: var(--brand-ink); }
nav.tabs { display: flex; gap: 2px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 11px 12px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--brand); font-weight: 500; }
.bar-filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 24px 0; }
main { padding: 16px 24px 40px; max-width: 1400px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; margin: 24px 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 12px; } .tiles { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.tile .k { font-size: 12px; color: var(--muted); } .tile .v { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; } .tile .s { font-size: 12px; color: var(--muted); }
.tile.tech { border-style: dashed; }

/* charts (single series → no legend; the card title names it) */
.chart { position: relative; height: 180px; display: flex; align-items: flex-end; gap: 2px; padding: 8px 0 22px; border-bottom: 1px solid var(--line); }
.chart .b { flex: 1; min-width: 3px; background: var(--mark); border-radius: 4px 4px 0 0; position: relative; }
.chart .b.zero { background: var(--line-2); min-height: 2px; }
.chart .b:hover, .chart .b:focus-visible { filter: brightness(1.2); outline: none; }
.chart .ax { position: absolute; bottom: 2px; font-size: 10.5px; color: var(--muted); } .chart .ax.r { right: 0; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 7px; white-space: nowrap; }
.hbars { display: grid; gap: 8px; } .hb { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 48px; gap: 10px; align-items: center; font-size: 12.5px; }
.hb .t { height: 10px; background: var(--line-2); border-radius: 4px; overflow: hidden; } .hb .t i { display: block; height: 100%; background: var(--mark); border-radius: 0 4px 4px 0; }
.hb .n { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter { height: 10px; background: var(--line-2); border-radius: 4px; overflow: hidden; margin: 8px 0 4px; } .meter i { display: block; height: 100%; background: var(--mark); }
.meter.warn i { background: var(--amber); } .meter.full i { background: var(--red); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; } .tbl-wrap { overflow-x: auto; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; } .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr:hover td { background: var(--card-2); }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--chip); } .pill.red { background: var(--soft-red); color: var(--red); } .pill.amber { background: var(--soft-amber); color: var(--amber); } .pill.green { background: var(--soft-green); color: var(--green); }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; } .form label { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); }
.form input, .form select { min-width: 120px; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; } .ok { color: var(--green); } .bad { color: var(--red); }
/* order drill-down */
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.detail-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; } .dh-title { font-size: 18px; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; } .chips button[aria-pressed=true] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.nowrap { white-space: nowrap; } .fw { font-weight: 500; }
@media (max-width: 640px) { header, nav.tabs, .bar-filters, main { padding-left: 16px; padding-right: 16px; } .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<!-- sign-in -->
<section class="signin" id="signin" hidden>
  <form id="loginForm" novalidate>
    <img class="mark" src="brand/boost-star.png" alt="">
    <h1>SmartFill Dashboard</h1>
    <p class="muted small" style="margin:0">Sign in with your SmartFill account.</p>
    <label>Email <input id="email" type="email" autocomplete="username"></label>
    <label>Password <input id="password" type="password" autocomplete="current-password"></label>
    <button class="primary" id="btnLogin" type="submit">Sign in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<!-- app -->
<div id="app" hidden>
  <header>
    <span id="brandSlot"><img class="mark" src="brand/boost-star.png" alt=""></span>
    <span class="title">SmartFill Dashboard</span>
    <span class="who"><span id="whoName"></span><span id="whoOrg" class="muted small"></span><span id="whoRole" class="badge"></span>
      <button class="ghost sm" id="btnTheme" title="Light / dark">◐</button><button class="ghost sm" id="btnLogout">Sign out</button></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="bar-filters">
    <label class="small muted">Period <select id="period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last 12 months</option></select></label>
    <label class="small muted" id="orgPick" hidden>Customer <select id="orgSel"><option value="">All customers</option></select></label>
    <span class="small muted" id="periodText"></span>
  </div>
  <main id="view"></main>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const $ = id => document.getElementById(id);
// Hosted under a path prefix (e.g. https://dashboard.boost-usa.com/tis/dashboard) or at the root (localhost:4010/dashboard):
// every call goes to <prefix>/v1/…, so the same page works in both places without editing.
const BASE = location.pathname.replace(/\/[^/]*\/?$/, '');
document.querySelectorAll('img.mark').forEach(i => { i.src = BASE + '/brand/boost-star.png'; });

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const money = n => n == null ? '–' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: n < 1 ? 3 : 2 });
const dt = d => d ? new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '–';
const dd = d => d ? new Date(d).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '–';
const secs = s => s == null ? '–' : s < 90 ? `${s}s` : `${Math.round(s / 60)} min`;
const ago = d => { if (!d) return '–'; const m = Math.round((Date.now() - Date.parse(d)) / 60e3); return m < 2 ? 'just now' : m < 60 ? `${m} min ago` : m < 48 * 60 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; };

// ---------------------------------------------------------------- theme
const themeKey = 'tisqc_dash_theme';
const setTheme = t => { document.documentElement.dataset.theme = t; try { localStorage.setItem(themeKey, t); } catch {} };
setTheme((() => { try { return localStorage.getItem(themeKey); } catch { return null; } })() || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('btnTheme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ---------------------------------------------------------------- sign-in (access token in memory, refresh token in an HttpOnly cookie)
let access = null, me = null, data = null, tab = 'overview';
async function refresh() {
  const r = await fetch(BASE + '/v1/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', credentials: 'same-origin' });
  if (!r.ok) { access = null; return false; }
  const j = await r.json(); access = j.accessToken; me = j; return true;
}
async function api(method, path, body, retried) {
  const r = await fetch(BASE + path, { method, headers: { Authorization: 'Bearer ' + access, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && !retried && await refresh()) return api(method, path, body, true);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 || (r.status === 403 && /LICENCE|SUSPENDED/.test(j.error?.code || ''))) { showSignIn(j.error?.message); throw new Error(j.error?.message || 'Please sign in.'); }
  if (!r.ok) throw new Error(j.error?.message || 'Something went wrong.');
  return j;
}
function showSignIn(msg) { $('app').hidden = true; $('signin').hidden = false; $('loginErr').textContent = msg && !/^please sign in/i.test(msg) ? msg : ''; setTimeout(() => $('email').focus(), 30); }
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('btnLogin').disabled = true; $('loginErr').textContent = '';
  try {
    const r = await fetch(BASE + '/v1/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value, client: 'dashboard' }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || 'Sign-in failed.');
    access = j.accessToken; me = j; $('password').value = ''; start();
  } catch (err) { $('loginErr').textContent = err.message; } finally { $('btnLogin').disabled = false; }
};
$('btnLogout').onclick = async () => { await fetch(BASE + '/v1/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {}); access = null; showSignIn(); };

// ---------------------------------------------------------------- app
const admin = () => me?.user?.role === 'admin';
const TABS = () => admin() ? [['overview', 'Overview'], ['orders', 'Orders'], ['ai', 'AI usage & cost'], ['customers', 'Customers & licences'], ['users', 'Users'], ['rules', 'AI rules']]
  : [['overview', 'Overview'], ['orders', 'Orders'], ['inspectors', 'Inspectors'], ['licence', 'Licence & team']];
async function start() {
  $('signin').hidden = true; $('app').hidden = false;
  $('whoName').textContent = me.user.name; $('whoOrg').textContent = admin() ? '' : me.org?.name || '';
  // a customer sees their own logo; admins (us) and organisations without a logo see SmartFill's mark
  const b = !admin() && me.org?.brand, light = b?.logoLight, dark = b?.logoDark || light;
  $('brandSlot').innerHTML = light ? `<img class="logo logo-light" src="${esc(light)}" alt="${esc(b.name)}"><img class="logo logo-dark" src="${esc(dark)}" alt="${esc(b.name)}">` : `<img class="mark" src="${BASE}/brand/boost-star.png" alt="">`;
  $('whoRole').textContent = admin() ? 'Admin' : 'Customer'; $('whoRole').className = 'badge' + (admin() ? ' admin' : '');
  $('orgPick').hidden = !admin();
  if (location.hash.length > 1 && TABS().some(([k]) => k === location.hash.slice(1))) tab = location.hash.slice(1);   // e.g. /dashboard#rules
  if (!TABS().some(([k]) => k === tab)) tab = 'overview';   // e.g. a customer tab after an admin signs in
  $('tabs').innerHTML = TABS().map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${k === tab}">${l}</button>`).join('');
  await load();
}
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; detail = null; [...$('tabs').children].forEach(x => x.setAttribute('aria-selected', String(x === b))); render(); };
$('period').onchange = () => { detail = null; load(); }; $('orgSel').onchange = () => { detail = null; load(); };
async function load() {
  const days = Number($('period').value), from = new Date(Date.now() - (days - 1) * 864e5).toISOString().slice(0, 10);
  const q = new URLSearchParams({ from }); if ($('orgSel').value) q.set('org', $('orgSel').value);
  $('view').innerHTML = '<div class="empty">Loading…</div>';
  try { data = await api('GET', '/v1/dashboard?' + q); } catch (e) { $('view').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (admin()) { const cur = $('orgSel').value; $('orgSel').innerHTML = '<option value="">All customers</option>' + (data.orgs || []).map(o => `<option value="${esc(o.orgId)}"${o.orgId === cur ? ' selected' : ''}>${esc(o.name)}</option>`).join(''); }
  $('periodText').textContent = `${dd(data.period.from)} – ${dd(data.period.to)}`;
  render();
}
function render() { document.querySelector('.bar-filters').hidden = tab === 'rules'; $('view').innerHTML = ({ overview, orders, inspectors, licence, ai, customers, users, rules }[tab] || overview)(); bindTips(); }

const tile = (k, v, s = '', tech) => `<div class="card tile${tech ? ' tech' : ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
function columnChart(points, key, label, valueFmt = fmt) {
  const max = Math.max(1, ...points.map(p => p[key] || 0));
  return `<div class="chart" role="img" aria-label="${esc(label)}">${points.map(p => { const v = p[key] || 0;
    return `<div class="b${v ? '' : ' zero'}" tabindex="0" data-tip="${esc(dd(p.date))}: ${esc(valueFmt(v))}" style="height:${v ? Math.max(3, v / max * 100) : 1}%"></div>`; }).join('')}
    <span class="ax">${esc(dd(points[0]?.date))}</span><span class="ax r">${esc(dd(points.at(-1)?.date))}</span></div>`;
}
const hbars = (rows, label, key) => { const max = Math.max(1, ...rows.map(r => r[key])); return rows.length ? `<div class="hbars">${rows.map(r => `<div class="hb" data-tip="${esc(r[label])}: ${fmt(r[key])}"><span>${esc(r[label])}</span><span class="t"><i style="width:${r[key] / max * 100}%"></i></span><span class="n">${fmt(r[key])}</span></div>`).join('')}</div>` : '<div class="empty">Nothing in this period</div>'; };
function bindTips() {
  const tip = $('tip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    const show = e => { tip.textContent = el.dataset.tip; tip.hidden = false; const r = el.getBoundingClientRect(); tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, (e?.clientX ?? r.left + r.width / 2) - tip.offsetWidth / 2)) + 'px'; tip.style.top = (r.top - 34) + 'px'; };
    el.onmouseenter = show; el.onmousemove = show; el.onfocus = () => show(); el.onmouseleave = el.onblur = () => (tip.hidden = true);
  });
}

function overview() {
  const t = data.totals, ai = data.ai;
  return `<div class="grid tiles">
      ${tile('Orders reviewed', fmt(t.ordersReviewed), `${fmt(t.reviewsRun)} review runs`)}
      ${tile('Must-fix items found', fmt(t.mustFix), `${fmt(t.toCheck)} to check · ${fmt(t.advisory)} advisory`)}
      ${tile('Missed hazards found', fmt(t.hazardsFound), 'in photos, without a recommendation')}
      ${tile('Fixes applied', fmt(t.fixesApplied), `${fmt(t.dismissed)} dismissed${t.acceptance != null ? ` · ${t.acceptance}% accepted` : ''}`)}
      ${tile('Photos reviewed', fmt(t.photosReviewed), 'by the AI, counted once per photo')}
      ${tile('Average review time', secs(t.avgReviewSeconds), 'from start to results')}
      ${ai ? tile('AI cost', money(ai.cost), `${ai.costPerOrder != null ? money(ai.costPerOrder) + ' per order' : ''} · admin only`, true) : ''}
    </div>
    <div class="grid two" style="margin-top:12px">
      <div class="card"><h2 style="margin-top:0">Orders reviewed per day</h2>${columnChart(data.byDay, 'orders', 'Orders reviewed per day')}</div>
      <div class="card"><h2 style="margin-top:0">Findings by area</h2>${hbars(data.byArea, 'module', 'findings')}</div>
    </div>
    <h2>Most frequent issues</h2>
    <div class="card tbl-wrap">${data.topIssues.length ? `<table class="tbl"><thead><tr><th>Issue</th><th>Area</th><th class="num">Orders</th></tr></thead><tbody>${data.topIssues.map(i => `<tr><td>${esc(i.title)}</td><td class="muted">${esc(i.area)}</td><td class="num">${fmt(i.orders)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No issues in this period</div>'}</div>`;
}
// ---------------------------------------------------------------- one order in detail (click an order number)
let detail = null, detailFilter = 'all';
const DEC_PILL = { Applied: 'green', Dismissed: 'amber', Undone: '', 'Not acted on': '' }, SEV_PILL = { 'Must fix': 'red', 'To check': 'amber', Advisory: '', Note: '' };
const FILTERS = [['all', 'All'], ['must', 'Must fix'], ['open', 'Not acted on'], ['Dismissed', 'Dismissed'], ['Applied', 'Applied']];
async function openOrder(id) {
  $('view').innerHTML = '<div class="empty">Loading…</div>';
  try { detail = await api('GET', '/v1/dashboard/orders/' + encodeURIComponent(id)); detailFilter = 'all'; }
  catch (e) { detail = { error: e.message, orderId: id }; }
  render(); window.scrollTo(0, 0);
}
function orderDetail() {
  const d = detail, A = admin();
  const back = '<button class="ghost sm" data-back>← All orders</button>';
  if (d.error) return `${back}<div class="card empty" style="margin-top:12px">${esc(d.error)}</div>`;
  const c = d.counts, f = d.findings.filter(x => detailFilter === 'all' || (detailFilter === 'must' ? x.severity === 'Must fix' : detailFilter === 'open' ? x.decision === 'Not acted on' : x.decision === detailFilter));

});
$('view').addEventListener('click', async e => {
  if (e.target.id === 'addPlan') { e.target.closest('form').querySelector('tbody').insertAdjacentHTML('beforeend', `<tr data-plan-row><td><input name="name" placeholder="Plan name" aria-label="Plan name"><input type="hidden" name="id" value=""></td><td class="num"><input name="imagesPerMonth" type="number" min="0" value="1000" aria-label="Photos per month"></td><td class="num"><input name="seats" type="number" min="0" value="3" aria-label="Seats"></td><td><input name="price" placeholder="e.g. $499 / month" aria-label="Price"></td><td><button class="ghost sm" type="button" data-del-plan>Remove</button></td></tr>`); return; }
  if (e.target.matches('[data-del-plan]')) { e.target.closest('tr').remove(); return; }
  const dv = e.target.closest('[data-device]');
  if (dv) {   // first click asks, second click signs that computer out
    if (!dv.dataset.sure) { dv.dataset.sure = '1'; dv.textContent = 'Click again to sign out'; dv.classList.add('bad'); setTimeout(() => { if (dv.isConnected) { delete dv.dataset.sure; dv.textContent = 'Sign out'; dv.classList.remove('bad'); } }, 4000); return; }
    dv.disabled = true; dv.textContent = 'Signing out…';
    try { await api('POST', `/v1/devices/${encodeURIComponent(dv.dataset.device)}/sign-out`); await load(); } catch (err) { dv.disabled = false; dv.textContent = err.message; }
    return;
  }
  const eo = e.target.closest('[data-edit-org]');
  if (eo) { const o = data.orgs.find(x => x.orgId === eo.dataset.editOrg), L = o.licence || {};
    $('orgEditor').innerHTML = `<h2>Edit ${esc(o.name)}</h2><form class="card form" id="editOrg" data-org="${esc(o.orgId)}"><label>Status <select name="status"><option value="active"${o.status === 'active' ? ' selected' : ''}>Active</option><option value="suspended"${o.status === 'suspended' ? ' selected' : ''}>Suspended</option></select></label>
      <label>Plan <select name="plan" data-plan-pick>${L.plan && !(data.plans || []).some(p => p.id === L.plan) ? `<option value="${esc(L.plan)}" selected>${esc(L.plan)} (not in the plan list)</option>` : ''}${(data.plans || []).map(p => `<option value="${esc(p.id)}"${p.id === L.plan ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
      <label>Photos / month <input name="imagesPerMonth" type="number" min="0" value="${L.imagesPerMonth ?? 0}"></label><label>Seats <input name="seats" type="number" min="0" value="${L.seats ?? 0}"></label><label>Valid until <input name="expiresAt" type="date" value="${L.expiresAt ? L.expiresAt.slice(0, 10) : ''}"></label>
      <label>Platform <select name="platform">${platformOpts(o.platform)}</select></label>
      <div class="reset-row"><span class="small">Photos used this month: <b>${fmt(o.usage?.imagesThisMonth ?? 0)}</b>${L.imagesPerMonth ? ` of ${fmt(L.imagesPerMonth)}` : ''}${L.usageResetAt && Date.parse(L.usageResetAt) >= Date.UTC(new Date().getUTCFullYear(), new Date().getUTCMonth(), 1) ? ` <span class="muted">(counted since ${esc(dt(L.usageResetAt))})</span>` : ''}</span>
        <button class="ghost sm" type="button" data-reset-photos="${esc(o.orgId)}">Reset photos used to 0</button></div>
      <div class="brand-edit"><label>Name on their logo <input name="brandName" value="${esc(o.brand?.name || o.name)}" maxlength="80"></label>
        <div class="logo-prev">${o.brand?.logoLight ? `<span class="lp light"><img src="${esc(o.brand.logoLight)}" alt="Logo on light"></span><span class="lp dark"><img src="${esc(o.brand.logoDark || o.brand.logoLight)}" alt="Logo on dark"></span>` : '<span class="muted small">No logo yet: their team sees the SmartFill mark.</span>'}</div>
        <label>Logo for light theme <input name="logoLight" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
        <label>Logo for dark theme (optional) <input name="logoDark" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
        ${o.brand?.logoLight ? '<label class="chk"><input type="checkbox" name="removeLogo"> Remove the logo</label>' : ''}</div>
      <button class="primary" type="submit">Save</button><span class="note"></span></form>`; $('orgEditor').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  const b = e.target.closest('[data-user]'); if (!b) return;
  const id = b.dataset.user;
  if (b.dataset.do === 'password') { $('pwEditor').innerHTML = `<h2>New password</h2><form class="card form" id="setPw" data-user="${esc(id)}"><label>Password <input name="password" type="password" autocomplete="new-password" required></label><button class="primary" type="submit">Set password</button><span class="note"></span></form>`; return; }
  try {
    if (b.dataset.do === 'signout') { await api('POST', `/v1/admin/users/${id}/sign-out`); }
    else await api('PATCH', '/v1/admin/users/' + id, { status: b.dataset.do === 'disable' ? 'disabled' : 'active' });
    await load();
  } catch (err) { b.textContent = err.message; }
});

// ---------------------------------------------------------------- AI rules (admins): what SmartFill checks, without code
// Notes = plain-English instructions added to every AI review (all clients, one client or one form).
// Checks = fixed "if answer A is X, answer B must …" tests that run on every review without the AI.
const R = { tree: null, scope: 'universal', name: 'all', doc: null, editing: null, msg: '' };
const SEV = { blocker: ['Must fix', 'red'], warning: ['To check', 'amber'], advisory: ['Advisory', ''] };
const qLabel = q => { const s = String(q || '').replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); };
const vals = list => (list || []).map(v => v === '' ? 'blank' : `“${v}”`).join(' or ');
/** A check as a sentence a reviewer can read. */
function checkSentence(r) {
  if (r.kind !== 'dsl' || !r.when || !r.then) return r.message || r.id;
  const t = r.then.notIn ? `must not be ${vals(r.then.notIn)}` : r.then.in ? `must be ${vals(r.then.in)}` : 'is checked';
  return `If “${qLabel(r.when.q)}” is “${r.when.equals}”, then “${qLabel(r.then.q)}” ${t}.`;
}
/** A change-log line in plain words ("doc client/X: why" → "Notes for X: why"). */
function logText(c) {
  const m = /^doc (universal|client|form)\/(.*?):\s*(.*)$/s.exec(c.note || '');
  if (m) return `Notes for ${m[1] === 'universal' ? 'all clients' : m[2]}${m[3] ? `: ${m[3]}` : ''}`;
  if (/^Seeded from/.test(c.note || '')) return 'Starting checks';
  return c.note || (c.changed || []).map(id => checkSentence(R.tree?.rules.find(r => r.id === id) || { message: id })).join('; ');
}
function rules() { setTimeout(loadRules); return '<div id="rulesView"><div class="empty">Loading…</div></div>'; }
async function loadRules() {
  try { R.tree = await api('GET', '/v1/rules/tree'); } catch (e) { if ($('rulesView')) $('rulesView').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  await openNote(R.scope, R.name, true);
}
async function openNote(scope, name, keepMsg) {
  R.scope = scope; R.name = name; if (!keepMsg) R.msg = '';
  R.doc = name ? await api('GET', `/v1/rules/${scope}/${encodeURIComponent(name)}`).catch(() => null) : null;
  drawRules();
}
function drawRules() {
  const T = R.tree, el = $('rulesView'); if (!T || !el) return;
  const withNotes = T.docs.map(k => { const i = k.indexOf('/'); return { scope: k.slice(0, i), name: k.slice(i + 1) }; });
  const names = R.scope === 'client' ? Object.keys(T.clients).filter(c => T.clients[c].status !== 'excluded') : R.scope === 'form' ? T.forms : [];
  const last = R.doc?.history?.at(-1);
  const drafts = Object.values(T.draftRules || {});
  const draftIds = new Set(drafts.map(d => d.id));
  const rows = [...drafts.filter(d => !T.rules.some(r => r.id === d.id)), ...T.rules.map(r => T.draftRules?.[r.id] || r)];
  el.innerHTML = `
    <p class="note" style="margin-top:0">Two ways to change what SmartFill checks, without code. Changes apply from the next <b>Run AI review</b>; reviews already done stay as they are.</p>

    <h2>Notes for the AI</h2>
    <form class="card" id="noteForm">
      <p class="note" style="margin:0 0 12px">Plain-English instructions the AI follows on every review. One instruction per line works best, e.g. <i>“Flag every sidewalk crack as a required recommendation.”</i></p>
      <div class="form">
        <label>Applies to <select id="rScope"><option value="universal"${R.scope === 'universal' ? ' selected' : ''}>All clients</option><option value="client"${R.scope === 'client' ? ' selected' : ''}>One client</option><option value="form"${R.scope === 'form' ? ' selected' : ''}>One form</option></select></label>
        ${R.scope === 'universal' ? '' : `<label>${R.scope === 'client' ? 'Client' : 'Form'} <input id="rName" list="rNames" value="${esc(R.name || '')}" placeholder="Type to search…" style="min-width:260px"><datalist id="rNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></label>`}
      </div>
      ${R.scope !== 'universal' && !R.name ? '<p class="note">Pick a name to see or write its notes.</p>' : R.scope !== 'universal' && !names.includes(R.name) ? `<p class="note bad">“${esc(R.name)}” is not in the list, so its notes would never be used. Pick a ${R.scope === 'client' ? 'client' : 'form'} from the list.</p>` : `
      <textarea id="rText" rows="7" placeholder="- One instruction per line" style="width:100%;margin-top:12px">${esc(R.doc?.markdown || '')}</textarea>
      <div class="form" style="margin-top:8px"><label style="flex:1">Why (for the change log) <input id="rWhy" placeholder="e.g. Asked by TIS on the weekly call" style="width:100%"></label><button class="primary" type="submit">Save notes</button></div>
      <p class="note">${last ? `Last changed ${esc(dt(last.at))}${last.author ? ` by ${esc(last.author)}` : ''} · ${R.doc.versions} version${R.doc.versions === 1 ? '' : 's'} kept` : 'No notes here yet.'} ${R.msg ? `<span class="ok">${esc(R.msg)}</span>` : ''}</p>`}
      ${withNotes.length ? `<p class="note">Has notes: ${withNotes.map(w => `<button type="button" class="ghost sm" data-r-open="${esc(w.scope)}|${esc(w.name)}">${esc(w.scope === 'universal' ? 'All clients' : w.name)}</button>`).join(' ')}</p>` : ''}
    </form>

    <h2>Automatic checks</h2>
    <div class="card">
      <p class="note" style="margin:0 0 10px">Run on every review without the AI and show up in the reviewer's panel. “Built in” checks are part of SmartFill; “Yours” you can change here.</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Check</th><th>Shown as</th><th>Type</th><th></th></tr></thead><tbody>
      ${rows.map(r => { const [lab, col] = SEV[r.severity] || [r.severity, '']; const mine = r.kind === 'dsl';
        return `<tr${r.deleted ? ' style="opacity:.55"' : ''}><td>${esc(checkSentence(r))}${mine && r.message ? `<div class="muted small">Reviewer sees: ${esc(r.message)}</div>` : ''}</td>
          <td><span class="pill ${col}">${esc(lab)}</span></td>
          <td style="white-space:nowrap">${mine ? 'Yours' : 'Built in'}${draftIds.has(r.id) ? ` <span class="pill amber">${r.deleted ? 'to remove' : 'not published'}</span>` : ''}</td>
          <td style="white-space:nowrap">${mine && !r.deleted ? `<button class="ghost sm" type="button" data-r-edit="${esc(r.id)}">Edit</button> <button class="ghost sm" type="button" data-r-del="${esc(r.id)}">Remove</button>` : ''}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="form" style="margin-top:12px"><button class="ghost" type="button" data-r-new>Add a check</button></div>
      <div id="rEdit"></div>
      ${drafts.length ? `<form class="form" id="publishForm" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)">
        <span class="small"><b>${drafts.length}</b> change${drafts.length === 1 ? '' : 's'} not published yet: reviews don't use ${drafts.length === 1 ? 'it' : 'them'} until you publish.</span>
        <label style="flex:1">Why (for the change log) <input name="note" style="width:100%" required></label><button class="primary" type="submit">Publish</button></form>` : ''}
    </div>

    <h2>Change log</h2>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>What changed</th></tr></thead><tbody>
      ${(T.changelog || []).slice().reverse().slice(0, 30).map(c => `<tr><td style="white-space:nowrap">${esc(dt(c.at))}</td><td>${esc(c.author || '')}</td><td>${esc(logText(c))}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No changes yet.</td></tr>'}
    </tbody></table></div>`;
  if (R.editing) drawEditor();
}
/** Add / edit a check with plain fields (no code). */
function drawEditor() {
  const r = R.editing, qs = R.tree.questions || [];
  const opt = (sel) => qs.map(q => `<option value="${esc(q)}"${q === sel ? ' selected' : ''}>${esc(qLabel(q))}</option>`).join('');
  const mustNot = !!r.then?.notIn, list = (r.then?.notIn || r.then?.in || []).map(v => v === '' ? 'blank' : v).join(', ');
  $('rEdit').innerHTML = `<form class="card form" id="checkForm" style="margin-top:12px;background:var(--card-2)">
    <label>If the answer to <select name="whenQ">${opt(r.when?.q)}</select></label>
    <label>is <input name="equals" value="${esc(r.when?.equals ?? 'Yes')}" style="min-width:90px"></label>
    <label>then <select name="thenQ">${opt(r.then?.q)}</select></label>
    <label>must <select name="mode"><option value="notIn"${mustNot ? ' selected' : ''}>not be</option><option value="in"${mustNot ? '' : ' selected'}>be</option></select></label>
    <label>any of (comma between; “blank” = empty) <input name="values" value="${esc(list || 'N/A, blank')}" style="min-width:180px"></label>
    <label>Show it as <select name="severity">${Object.entries(SEV).map(([k, [l]]) => `<option value="${k}"${k === r.severity ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
    <label style="flex-basis:100%">What the reviewer reads <input name="message" value="${esc(r.message || '')}" placeholder="e.g. Brick veneer is Yes but the backing material is blank." style="width:100%" required></label>
    <button class="primary" type="submit">Save</button><button class="ghost" type="button" data-r-test>Try on saved orders</button><button class="ghost" type="button" data-r-cancel>Cancel</button>
    <span class="note" id="rEditMsg"></span><div id="rTest" style="flex-basis:100%"></div></form>`;
}
function checkFromForm(f) {
  const d = Object.fromEntries(new FormData(f).entries()), r = R.editing;
  const values = d.values.split(',').map(s => s.trim()).map(s => /^blank$/i.test(s) ? '' : s).filter((s, i, a) => a.indexOf(s) === i);
  const id = r.id || `custom.${d.whenQ}_${d.thenQ}_${Date.now().toString(36)}`;
  return { ...r, id, kind: 'dsl', severity: d.severity, scope: r.scope || { formTypes: ['general', 'property_only'] },
    when: { q: d.whenQ, equals: d.equals.trim() }, then: { q: d.thenQ, [d.mode]: values }, message: d.message.trim(), checklistItem: r.checklistItem || '' };
}
const saveDraft = rule => api('PUT', `/v1/rules/rule/${encodeURIComponent(rule.id)}`, { rule });
$('view').addEventListener('change', e => {
  if (e.target.id === 'rScope') openNote(e.target.value, e.target.value === 'universal' ? 'all' : '');
  if (e.target.id === 'rName' && e.target.value) openNote(R.scope, e.target.value);
});
$('view').addEventListener('click', async e => {
  const o = e.target.closest('[data-r-open]'); if (o) { const [s, n] = o.dataset.rOpen.split('|'); return openNote(s, n); }
  if (e.target.closest('[data-r-new]')) { R.editing = { severity: 'warning' }; drawEditor(); return $('rEdit').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  const ed = e.target.closest('[data-r-edit]'); if (ed) { const id = ed.dataset.rEdit; R.editing = structuredClone(R.tree.draftRules?.[id] || R.tree.rules.find(r => r.id === id)); drawEditor(); return $('rEdit').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  if (e.target.closest('[data-r-cancel]')) { R.editing = null; $('rEdit').innerHTML = ''; return; }
  const del = e.target.closest('[data-r-del]');
  if (del) {   // second click confirms (no browser pop-ups)
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Click again to remove'; del.classList.add('bad'); return; }
    const r = R.tree.draftRules?.[del.dataset.rDel] || R.tree.rules.find(x => x.id === del.dataset.rDel);
    try { await saveDraft({ ...r, deleted: true }); R.editing = null; await loadRules(); } catch (err) { del.textContent = err.message; } return;
  }
  if (e.target.closest('[data-r-test]')) {
    const f = $('checkForm'); try { const rule = checkFromForm(f); await saveDraft(rule); R.editing = rule;
      const t = await api('POST', `/v1/rules/rule/${encodeURIComponent(rule.id)}/test`, {});
      $('rTest').innerHTML = `<p class="small">Would flag <b>${t.ordersFlagged}</b> of ${t.ordersTested} saved orders${t.ordersFlagged ? ': ' + t.results.filter(x => x.hits.length).slice(0, 12).map(x => esc(x.orderId)).join(', ') : ''}. Saved as not published.</p>`;
      R.tree = await api('GET', '/v1/rules/tree'); } catch (err) { $('rEditMsg').textContent = err.message; $('rEditMsg').className = 'note bad'; }
  }
});
$('view').addEventListener('submit', async e => {
  const f = e.target; if (!['noteForm', 'checkForm', 'publishForm'].includes(f.id)) return;
  e.preventDefault(); e.stopImmediatePropagation();
  try {
    if (f.id === 'noteForm') { await api('PUT', `/v1/rules/${R.scope}/${encodeURIComponent(R.name)}`, { markdown: $('rText').value, note: $('rWhy').value }); R.msg = 'Saved. Used from the next review.'; R.tree = await api('GET', '/v1/rules/tree'); await openNote(R.scope, R.name, true); }
    if (f.id === 'checkForm') { await saveDraft(checkFromForm(f)); R.editing = null; await loadRules(); }
    if (f.id === 'publishForm') { await api('POST', '/v1/rules/publish', { note: f.note.value }); R.editing = null; await loadRules(); }
  } catch (err) { const m = f.querySelector('.note:last-of-type') || f; m.textContent = err.message; m.classList.add('bad'); }
}, true);

// boot: a valid refresh cookie signs you straight in
(async () => { if (await refresh()) start(); else showSignIn(); })();
</script>
</body>
