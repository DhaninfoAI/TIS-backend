# nginx site for the SmartFill backend + dashboard.
# setup.sh copies this to /etc/nginx/sites-available/smartfill and replaces smartfill.example.com with your domain.
# The Node app listens on 127.0.0.1:4010 only (systemd sets HOST/PORT); nginx is the only way in, over HTTPS.

upstream smartfill_backend {
    server 127.0.0.1:4010;
    keepalive 16;
}

# Plain HTTP: certificate checks (Let's Encrypt) and a redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smartfill.example.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartfill.example.com;

    ssl_certificate     /etc/letsencrypt/live/smartfill.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartfill.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 64m;      # an order's snapshot and its photos are uploaded by the extension
    proxy_read_timeout 300s;       # an AI review can take a few minutes
    proxy_send_timeout 300s;

    # The site's front door is the dashboard
    location = / { return 302 /dashboard; }

    # Developer-only pages stay off the public server (preview harness, saved sample orders, writer test, API explorer)
    location ~ ^/(ext/|fixtures/|writer-test|harness-chrome-stub\.js|content/|index\.html) { return 404; }

    # Live review progress (Server-Sent Events): no buffering, long-lived
    location ~ ^/v1/analyses/[^/]+/events$ {
        proxy_pass http://smartfill_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Everything else: API (/v1/…), dashboard (/dashboard), rules (/rules), logos (/brand/…)
    location / {
        proxy_pass http://smartfill_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # the dashboard's sign-in cookie is marked Secure from this
    }
}
